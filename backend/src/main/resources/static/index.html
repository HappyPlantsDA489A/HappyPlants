<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Happy Plants</title>
    <link rel="icon" type="" href="">

    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link href="/static/css/styledestination.css" rel="stylesheet" type="text/css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
<div id="content-box">
    <img src="" id="logo" alt="head-logo">
    <h1>Happy Plants</h1>
    <p>Your personal online Plant caregiver</p>
    <hr>

    <div class="search-container">
        <form id="search-form">
            <div class="textbox-button-field">
                <h2>Search for your plant</h2>
                <input type="text" placeholder="eg. Philodendron" name="plantName" id="plantID">
                <button id="search-btn" type="submit"><i class="fa fa-search"></i></button>
            </div>

            <p id="empty-p"></p>

        </form>

        <h3>Take care of your plants</h3>
    </div>
</div>

<div id="loading-spinner">
    <i class="fa fa-spinner fa-spin"></i>
    <p>Finding your plant...</p>
</div>

<!-- Destination result -->
<div id="destination-container" style="display:none; margin-top: 50px; padding-bottom: 50px;">

    <div class="location-section">
        <h2 class="location-title" id="location-title"></h2>
        <div class="title-underline"></div>
    </div>

    <div class="destination-image-wrapper">
        <img id="city-image" src="" alt="City view">
    </div>

    <div class="button-group">
        <a id="spotify-btn" class="btn-pill" href="#" target="_blank">
            <i class="fa fa-spotify"></i> Flight Playlist
        </a>

        <button
                id="sights-btn"
                class="btn-pill"
                type="button"
                aria-expanded="false"
                aria-controls="sights-panel">
            <i class="fa fa-camera"></i> Sights
        </button>

        <button
                id="facts-btn"
                class="btn-pill"
                type="button"
                aria-expanded="false"
                aria-controls="facts-panel">
            <i class="fa fa-info-circle"></i> Facts
        </button>
    </div>

    <!-- Accordion panels -->
    <div id="sights-panel" class="accordion-panel is-hidden" role="region" aria-labelledby="sights-btn"></div>
    <div id="facts-panel" class="accordion-panel is-hidden" role="region" aria-labelledby="facts-btn"></div>
</div>

<footer>
    <a class="footer-text" href="/about-us">About espotiFly</a>
    <a class="footer-text" href="/">Home</a>
</footer>

<script type="module" src="/static/js/actionListener.js"></script>
</body>
</html>
